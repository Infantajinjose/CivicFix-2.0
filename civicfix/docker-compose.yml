services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - civicfix_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/civicfix
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-before-deploying-123456}
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: http://localhost:5173
      MAX_UPLOAD_MB: 5
    ports:
      - "5000:5000"
    volumes:
      - civicfix_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  civicfix_mongo_data:
  civicfix_uploads:
